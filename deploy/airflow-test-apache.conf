<VirtualHost *:443>
    ServerAdmin suslov@oms66.ru
    ServerName airflow-test.oms66.ru
    SSLEngine on
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder on
    SSLCipherSuite HIGH:!aNULL:!MD5:!SHA1
    SSLCertificateKeyFile /etc/ssl/private/oms66.key
    SSLCertificateFile /etc/ssl/certs/oms66.crt
    SSLCertificateChainFile /etc/ssl/certs/oms66-ca.crt
    ProxyRequests     Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    <Proxy http://127.0.0.1:8082/*>
        Order deny,allow
        Allow from all
    </Proxy>
    ProxyPass         /  http://localhost:8082/ nocanon
    ProxyPassReverse  /  http://localhost:8082/
    ProxyPassReverse  /  https://airflow-test.oms66.ru/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "airflow-test.oms66.ru"
</VirtualHost>
